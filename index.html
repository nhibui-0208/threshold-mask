<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threshold + Mask → PNG nền trong suốt</title>
<style>
  :root{
    --bg:#15171a; --panel:#1d2024; --line:#2e3238; --text:#e6e3dc; --mute:#8d9199; --accent:#e3c95c;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-columns:320px 1fr;}
  aside{background:var(--panel);border-right:1px solid var(--line);padding:18px;overflow:auto;height:100vh}
  h1{font-size:16px;margin:0 0 4px;font-weight:650}
  p.sub{margin:0 0 16px;color:var(--mute);font-size:12.5px}
  .drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--mute);cursor:pointer;margin-bottom:16px}
  .drop.over,.drop:hover{border-color:var(--accent);color:var(--text)}
  .row{margin-bottom:13px}
  .row label{display:flex;justify-content:space-between;margin-bottom:4px}
  .row label b{font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--accent)}
  select{width:100%;background:#111316;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px}
  .chk{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  .chk input{accent-color:var(--accent)}
  button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:#111316;color:var(--text);padding:8px 12px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#1a1700;font-weight:650;width:100%;padding:10px}
  button:disabled{opacity:.4;cursor:not-allowed}
  hr{border:0;border-top:1px solid var(--line);margin:16px 0}
  main{display:flex;flex-direction:column;height:100vh;min-width:0}
  .bar{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);color:var(--mute);font-size:12.5px;flex-wrap:wrap}
  .bar .sp{flex:1}
  .seg button{padding:4px 10px;font-size:12.5px}
  .seg button.on{background:var(--accent);color:#1a1700;border-color:var(--accent)}
  .stage{flex:1;overflow:auto;display:grid;place-items:center;padding:16px;min-height:0}
  .stage.black{background:#000}
  .stage.checker{background:conic-gradient(#2a2d31 25%,#34383d 0 50%,#2a2d31 0 75%,#34383d 0) 0 0/20px 20px}
  .stage.white{background:#fff}
  canvas{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .empty{color:var(--mute)}
  .note{font-size:12px;color:var(--mute);margin-top:6px}
  @media(max-width:760px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{height:auto;border-right:0;border-bottom:1px solid var(--line)}main{height:80vh}}
</style>
</head>
<body>
<aside>
  <h1>Threshold + Mask</h1>
  <p class="sub">Giữ lại pixel sáng, bỏ vùng tối thành nền trong suốt. Chạy 100% trên máy bạn.</p>

  <div class="drop" id="drop">Kéo thả ảnh vào đây<br>hoặc bấm để chọn file</div>
  <input type="file" id="file" accept="image/*" hidden>

  <div class="row">
    <label>Kênh đo độ sáng</label>
    <select id="mode">
      <option value="luma">Luminance (mặc định)</option>
      <option value="max">Max(R,G,B)</option>
      <option value="min">Min(R,G,B)</option>
      <option value="g">Kênh G</option>
      <option value="b">Kênh B</option>
    </select>
  </div>
  <div class="row"><label>Ngưỡng (threshold) <b id="vT"></b></label><input type="range" id="T" min="0" max="255" value="165"></div>
  <div class="row"><label>Độ mềm cạnh <b id="vS"></b></label><input type="range" id="S" min="0" max="60" value="0"></div>
  <div class="row"><label>Bão hòa tối đa (loại màu cam) <b id="vSat"></b></label><input type="range" id="Sat" min="0" max="100" value="100"></div>
  <div class="row"><label>Làm mờ trước khi cắt (px) <b id="vB"></b></label><input type="range" id="B" min="0" max="6" step="0.5" value="0"></div>
  <div class="row"><label>Xóa đốm lẻ (số láng giềng tối thiểu) <b id="vN"></b></label><input type="range" id="N" min="0" max="8" value="0"></div>
  <div class="row"><label>Độ sáng màu giữ lại <b id="vG"></b></label><input type="range" id="G" min="50" max="200" value="100"></div>
  <div class="chk"><input type="checkbox" id="inv"><label for="inv">Đảo mask (giữ vùng tối)</label></div>

  <div class="row">
    <label>Kích thước xuất <b id="vSc"></b></label>
    <select id="scale">
      <option value="1">100% (gốc)</option>
      <option value="0.5">50%</option>
      <option value="0.25">25%</option>
      <option value="2">200%</option>
    </select>
  </div>

  <hr>
  <button class="primary" id="dl" disabled>Tải PNG (nền trong suốt)</button>
  <p class="note">Nền đen = alpha 0. Mở file trên nền nào cũng thấy phần giữ lại; xem thử bằng nút Đen / Caro / Trắng phía trên.</p>
</aside>

<main>
  <div class="bar">
    <span id="info">Chưa có ảnh</span><span class="sp"></span>
    <span>Nền xem thử:</span>
    <span class="seg" id="bg">
      <button data-bg="black" class="on">Đen</button><button data-bg="checker">Caro</button><button data-bg="white">Trắng</button>
    </span>
    <button id="cmp" disabled>Giữ để xem ảnh gốc</button>
  </div>
  <div class="stage black" id="stage">
    <div class="empty" id="empty">Chọn ảnh để bắt đầu</div>
    <canvas id="out" hidden></canvas>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const out = $('out'), octx = out.getContext('2d');
  let img = null, fileName = 'mask', raf = 0, showOrig = false;

  const ids = ['T','S','Sat','B','N','G'];
  const fmt = {T:v=>v,S:v=>v,Sat:v=>v+'%',B:v=>v,N:v=>v,G:v=>v+'%'};
  const label = {T:'vT',S:'vS',Sat:'vSat',B:'vB',N:'vN',G:'vG'};
  const refreshLabels = () => ids.forEach(k => $(label[k]).textContent = fmt[k]($(k).value));
  refreshLabels();

  function load(file){
    if(!file || !file.type.startsWith('image/')) return;
    fileName = file.name.replace(/\.[^.]+$/,'');
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { img = im; $('empty').hidden = true; out.hidden = false;
      $('dl').disabled = false; $('cmp').disabled = false; schedule(); };
    im.src = url;
  }

  function process(){
    if(!img) return;
    const sc = parseFloat($('scale').value);
    const w = Math.max(1, Math.round(img.naturalWidth * sc));
    const h = Math.max(1, Math.round(img.naturalHeight * sc));
    out.width = w; out.height = h;

    // nguồn (có thể làm mờ để đo ngưỡng, màu lấy từ ảnh gốc)
    const src = document.createElement('canvas'); src.width = w; src.height = h;
    const sctx = src.getContext('2d', {willReadFrequently:true});
    sctx.drawImage(img, 0, 0, w, h);
    const orig = sctx.getImageData(0, 0, w, h);

    const blur = parseFloat($('B').value);
    let meas = orig;
    if(blur > 0){
      const bc = document.createElement('canvas'); bc.width = w; bc.height = h;
      const bctx = bc.getContext('2d', {willReadFrequently:true});
      bctx.filter = `blur(${blur}px)`;
      bctx.drawImage(img, 0, 0, w, h);
      meas = bctx.getImageData(0, 0, w, h);
    }

    const mode = $('mode').value, T = +$('T').value, S = +$('S').value;
    const satMax = +$('Sat').value / 100, inv = $('inv').checked;
    const gain = +$('G').value / 100, minN = +$('N').value;
    const o = orig.data, m = meas.data, n = w*h;
    const alpha = new Float32Array(n);

    for(let i=0,p=0;i<n;i++,p+=4){
      const r=m[p], g=m[p+1], b=m[p+2];
      let v;
      switch(mode){
        case 'max': v = Math.max(r,g,b); break;
        case 'min': v = Math.min(r,g,b); break;
        case 'g': v = g; break;
        case 'b': v = b; break;
        default: v = 0.299*r + 0.587*g + 0.114*b;
      }
      let a = S > 0 ? Math.min(1, Math.max(0, (v - T)/S + 0.5)) : (v > T ? 1 : 0);
      if(satMax < 1){
        const mx = Math.max(r,g,b), mn = Math.min(r,g,b);
        const sat = mx ? (mx-mn)/mx : 0;
        if(sat > satMax) a = 0;
      }
      alpha[i] = inv ? 1 - a : a;
    }

    if(minN > 0){
      const keep = new Float32Array(alpha);
      for(let y=0;y<h;y++){
        for(let x=0;x<w;x++){
          const i = y*w+x;
          if(alpha[i] <= 0.5) continue;
          let c = 0;
          for(let dy=-1;dy<=1;dy++){
            const yy = y+dy; if(yy<0||yy>=h) continue;
            for(let dx=-1;dx<=1;dx++){
              if(!dx && !dy) continue;
              const xx = x+dx; if(xx<0||xx>=w) continue;
              if(alpha[yy*w+xx] > 0.5) c++;
            }
          }
          if(c < minN) keep[i] = 0;
        }
      }
      alpha.set(keep);
    }

    const res = octx.createImageData(w, h), d = res.data;
    for(let i=0,p=0;i<n;i++,p+=4){
      const a = alpha[i];
      if(a <= 0){ d[p]=d[p+1]=d[p+2]=d[p+3]=0; continue; }
      d[p]   = Math.min(255, o[p]*gain);
      d[p+1] = Math.min(255, o[p+1]*gain);
      d[p+2] = Math.min(255, o[p+2]*gain);
      d[p+3] = Math.round(a*255);
    }
    octx.putImageData(res, 0, 0);
    $('info').textContent = `${img.naturalWidth}×${img.naturalHeight} → xuất ${w}×${h}px`;
    if(showOrig) drawOrig();
  }

  function drawOrig(){ octx.clearRect(0,0,out.width,out.height); octx.drawImage(img,0,0,out.width,out.height); }
  function schedule(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(process); }

  ids.forEach(k => $(k).addEventListener('input', () => { refreshLabels(); schedule(); }));
  ['mode','scale','inv'].forEach(k => $(k).addEventListener('input', schedule));

  // upload
  const drop = $('drop'), file = $('file');
  drop.onclick = () => file.click();
  file.onchange = () => load(file.files[0]);
  ['dragenter','dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', ev => load(ev.dataTransfer.files[0]));
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => { e.preventDefault(); if(e.target !== drop) load(e.dataTransfer.files[0]); });
  window.addEventListener('paste', e => { const f = [...e.clipboardData.files][0]; if(f) load(f); });

  // nền xem thử
  $('bg').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    [...$('bg').children].forEach(x => x.classList.toggle('on', x === b));
    $('stage').className = 'stage ' + b.dataset.bg;
  });

  // so sánh với ảnh gốc
  const cmp = $('cmp');
  const down = () => { if(!img) return; showOrig = true; drawOrig(); };
  const up = () => { showOrig = false; schedule(); };
  cmp.addEventListener('pointerdown', down);
  ['pointerup','pointerleave','pointercancel'].forEach(e => cmp.addEventListener(e, up));

  // tải PNG
  $('dl').onclick = () => {
    if(!img) return;
    showOrig = false; process();
    out.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fileName + '_mask.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }, 'image/png');
  };
})();
</script>
</body>
</html>
